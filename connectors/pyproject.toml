[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-connectors"
version = "0.1.0"
description = "Kairo connectors: adapters for external data sources (S3, Notion, web, Slack, ...)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kairo-core",
]

[project.optional-dependencies]
# Each connector opts into its own deps so users only install what they use.
s3 = ["boto3>=1.34"]
notion = ["httpx>=0.27"]
web = ["httpx>=0.27", "beautifulsoup4>=4.12"]
slack = ["slack-sdk>=3.27"]
google = ["google-api-python-client>=2.120", "google-auth>=2.29"]

[tool.setuptools.packages.find]
where = ["src"]
