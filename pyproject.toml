[project]
name = "kairo"
version = "0.1.0"
description = "Kairo retrieval-native temporal graph engine SDK and CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "pandas>=2.2",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "openpyxl>=3.1",
    "soundfile>=0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
kairo = "kairo.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
