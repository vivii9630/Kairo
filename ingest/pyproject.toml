[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-ingest"
version = "0.1.0"
description = "Kairo ingest: multi-format document loaders (txt, jsonl, csv, xlsx, pdf, docx, audio)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kairo-core",
    "pandas>=2.2",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "openpyxl>=3.1",
    "soundfile>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
