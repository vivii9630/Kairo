[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-flow"
version = "0.1.0"
description = "Kairo flow: directed graph of agent/tool steps with cycle support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "kairo-core",
    "kairo-retrieval",
]

[tool.setuptools.packages.find]
where = ["src"]
