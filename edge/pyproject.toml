[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-edge"
version = "0.1.0"
description = "Kairo edge: ARM/mobile-minimal build — pure-Python retrieval and agent primitives with zero heavy dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Keep this list tiny on purpose. No pandas, pypdf, httpx, soundfile.
# If a dep shows up here, question it — edge is the mobile/ARM target.
dependencies = [
    "kairo-core",
]

[tool.setuptools.packages.find]
where = ["src"]
