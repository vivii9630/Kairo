[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-graph"
version = "0.1.0"
description = "Kairo graph: GraphBuilder protocol, KairoGraph (NetworkX-backed) with deterministic hashing and JSON round-trip, plus per-content-type builders."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "kairo-core",
    "kairo-embeddings",
    "networkx>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Leiden is preferred over Louvain for community detection (stronger
# modularity guarantees). Without this extra the detector degrades to
# networkx's louvain_communities transparently — same API, weaker cuts.
leiden = ["leidenalg>=0.10", "python-igraph>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]
