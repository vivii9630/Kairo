[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-ai"
version = "0.1.0"
description = "Kairo AI: FastAPI backend orchestrating connectors, engine, and agents behind a chat-native UI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "kairo-core",
    "kairo-connectors",
    "kairo-analytics",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.27",
    "pandas>=2.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
