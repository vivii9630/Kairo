[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairo-rag"
version = "0.1.0"
description = "Kairo RAG: retrieval-augmented patterns (plain, hybrid, temporal) built on kairo-agents and kairo-retrieval."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "kairo-core",
    "kairo-graph",
    "kairo-embeddings",
    "kairo-agents",
    "kairo-retrieval",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]
